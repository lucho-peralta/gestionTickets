paths:

  /clientes/{dni}/tickets:
    summary: Tickets reportados por un cliente.
    parameters:
      - in: path
        name: dni
        required: true
        description: DNI del cliente.
        schema:
          $ref: "common.yaml#/schemas/dni"

    get:
      tags: [clientes]
      operationId: clientes-dni-tickets-get
      summary: Lista los tickets del cliente, del más reciente al más antiguo.
      description: Como no hay tabla de clientes, un DNI sin tickets devuelve una lista vacía.
      responses:
        "200":
          description: Tickets del cliente (puede estar vacía).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "common.yaml#/schemas/ticket"
              examples:
                vacio:
                  value: []
                uno-en-revision:
                  value:
                    - id: 1
                      dni_cliente: "30123456"
                      categoria: conexion
                      descripcion: No tengo internet desde ayer a la noche.
                      estado: en_revision
                      fecha_inicio: "2026-09-20T10:15:00Z"
                      fecha_finalizacion: null
                      agente:
                        dni: "25987654"
                        nombre: María Gómez
        "400":
          $ref: "common.yaml#/responses/datos-invalidos"
