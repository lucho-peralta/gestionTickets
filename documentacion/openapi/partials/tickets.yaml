paths:

  /tickets:
    summary: Colección de tickets.

    post:
      tags: [tickets]
      operationId: tickets-post
      summary: Crea un ticket. El sistema asigna un agente al azar, pone fecha_inicio y estado "asignado".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/schemas/ticket-nuevo"
            examples:
              conexion:
                value:
                  dni_cliente: "30123456"
                  categoria: conexion
                  descripcion: No tengo internet desde ayer a la noche.
      responses:
        "201":
          description: Ticket creado y asignado a un agente.
          content:
            application/json:
              schema:
                $ref: "common.yaml#/schemas/ticket"
              examples:
                creado:
                  value:
                    id: 1
                    dni_cliente: "30123456"
                    categoria: conexion
                    descripcion: No tengo internet desde ayer a la noche.
                    estado: asignado
                    fecha_inicio: "2026-09-20T10:15:00Z"
                    fecha_finalizacion: null
                    agente:
                      dni: "25987654"
                      nombre: María Gómez
        "400":
          $ref: "common.yaml#/responses/datos-invalidos"
        "409":
          $ref: "common.yaml#/responses/sin-agentes"

  /tickets/{id}:
    summary: Un ticket en particular.
    parameters:
      - $ref: "#/parameters/id"

    get:
      tags: [tickets]
      operationId: tickets-id-get
      summary: Obtiene un ticket con su agente, estado y fechas.
      responses:
        "200":
          description: Ticket encontrado.
          content:
            application/json:
              schema:
                $ref: "common.yaml#/schemas/ticket"
              examples:
                en-proceso:
                  value:
                    id: 1
                    dni_cliente: "30123456"
                    categoria: conexion
                    descripcion: No tengo internet desde ayer a la noche.
                    estado: en_proceso
                    fecha_inicio: "2026-09-20T10:15:00Z"
                    fecha_finalizacion: null
                    agente:
                      dni: "25987654"
                      nombre: María Gómez
                asignado:
                  value:
                    id: 1
                    dni_cliente: "30123456"
                    categoria: conexion
                    descripcion: No tengo internet desde ayer a la noche.
                    estado: asignado
                    fecha_inicio: "2026-09-20T10:15:00Z"
                    fecha_finalizacion: null
                    agente:
                      dni: "25987654"
                      nombre: María Gómez
        "404":
          $ref: "common.yaml#/responses/ticket-no-encontrado"

    delete:
      tags: [tickets]
      operationId: tickets-id-delete
      summary: Elimina el ticket, sin importar su estado. Deja de contarse en los reportes.
      responses:
        "204":
          description: Ticket eliminado (sin cuerpo).
        "404":
          $ref: "common.yaml#/responses/ticket-no-encontrado"

  /tickets/{id}/estado:
    summary: Estado de un ticket.
    parameters:
      - $ref: "#/parameters/id"

    patch:
      tags: [tickets]
      operationId: tickets-id-estado-patch
      summary: Cambia el estado del ticket.
      description: |
        - El agente lo pasa a "en_proceso" y, cuando termina, a "en_revision".
        - El cliente, con el ticket en "en_revision", lo pasa a "cerrado" si el
          problema fue resuelto (se registra fecha_finalizacion) o lo devuelve a
          "en_proceso" si sigue.
        Solo se valida que el estado sea uno de los cuatro valores; no se
        validan las transiciones.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - estado
              properties:
                estado:
                  $ref: "common.yaml#/schemas/estado"
            examples:
              agente-en-proceso:
                value:
                  estado: en_proceso
              agente-en-revision:
                value:
                  estado: en_revision
              cliente-cierra:
                value:
                  estado: cerrado
      responses:
        "200":
          description: Estado actualizado.
          content:
            application/json:
              schema:
                $ref: "common.yaml#/schemas/ticket"
              examples:
                en-proceso:
                  value:
                    id: 1
                    dni_cliente: "30123456"
                    categoria: conexion
                    descripcion: No tengo internet desde ayer a la noche.
                    estado: en_proceso
                    fecha_inicio: "2026-09-20T10:15:00Z"
                    fecha_finalizacion: null
                    agente:
                      dni: "25987654"
                      nombre: María Gómez
                en-revision:
                  value:
                    id: 1
                    dni_cliente: "30123456"
                    categoria: conexion
                    descripcion: No tengo internet desde ayer a la noche.
                    estado: en_revision
                    fecha_inicio: "2026-09-20T10:15:00Z"
                    fecha_finalizacion: null
                    agente:
                      dni: "25987654"
                      nombre: María Gómez
                cerrado:
                  value:
                    id: 1
                    dni_cliente: "30123456"
                    categoria: conexion
                    descripcion: No tengo internet desde ayer a la noche.
                    estado: cerrado
                    fecha_inicio: "2026-09-20T10:15:00Z"
                    fecha_finalizacion: "2026-09-20T13:15:00Z"
                    agente:
                      dni: "25987654"
                      nombre: María Gómez
        "400":
          $ref: "common.yaml#/responses/datos-invalidos"
        "404":
          $ref: "common.yaml#/responses/ticket-no-encontrado"

# ----------------------------------------------
# Parámetros
# ----------------------------------------------

parameters:

  id:
    in: path
    name: id
    required: true
    description: Número de ticket.
    schema:
      type: integer
      minimum: 1

# ----------------------------------------------
# Esquemas
# ----------------------------------------------

schemas:

  ticket-nuevo:
    description: Datos que envía el cliente para crear un ticket.
    type: object
    required:
      - dni_cliente
      - categoria
      - descripcion
    properties:
      dni_cliente:
        $ref: "common.yaml#/schemas/dni"
      categoria:
        $ref: "common.yaml#/schemas/categoria"
      descripcion:
        description: Qué ocurrió.
        type: string
        minLength: 1
