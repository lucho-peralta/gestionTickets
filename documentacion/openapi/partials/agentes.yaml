paths:

  /agentes/{dni}/tickets:
    summary: Tickets asignados a un agente (su bandeja de trabajo).
    parameters:
      - in: path
        name: dni
        required: true
        description: DNI del agente.
        schema:
          $ref: "common.yaml#/schemas/dni"

    get:
      tags: [agentes]
      operationId: agentes-dni-tickets-get
      summary: Lista los tickets asignados al agente, del más antiguo al más reciente.
      parameters:
        - in: query
          name: estado
          required: false
          description: Filtra por estado.
          schema:
            $ref: "common.yaml#/schemas/estado"
      responses:
        "200":
          description: Tickets del agente (puede estar vacía).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "common.yaml#/schemas/ticket"
              examples:
                vacio:
                  value: []
                uno-asignado:
                  value:
                    - id: 1
                      dni_cliente: "30123456"
                      categoria: conexion
                      descripcion: No tengo internet desde ayer a la noche.
                      estado: asignado
                      fecha_inicio: "2026-09-20T10:15:00Z"
                      fecha_finalizacion: null
                      agente:
                        dni: "25987654"
                        nombre: María Gómez
        "400":
          $ref: "common.yaml#/responses/datos-invalidos"
        "404":
          $ref: "common.yaml#/responses/agente-no-encontrado"
