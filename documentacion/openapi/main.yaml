openapi: 3.0.0
info:
  title: Tickets de Soporte REST API
  version: 0.1.0
  description: |
    API del Sistema de Gestión de Tickets de Soporte.

    - El cliente crea un ticket con su DNI, la categoría y la descripción;
      el sistema le asigna un agente al azar y lo deja en estado "asignado".
    - El agente consulta sus tickets por DNI y cambia el estado
      (asignado → en_proceso → en_revision).
    - El cliente confirma la resolución pasando el ticket a "cerrado"
      (se registra fecha_finalizacion) o lo devuelve a "en_proceso".
    - Reportes: frecuencia por categoría, tiempo promedio de resolución
      y top de categorías.

    Supuestos: sin login (identificación por DNI), agentes precargados,
    sin tabla de clientes, validaciones mínimas.
  license:
    name: MIT
    url: https://opensource.org/license/MIT

servers:
  - url: "http://localhost:3000"
    description: Desarrollo

# Sin autenticación: el sistema no tiene login.
security: []

tags:
  - name: tickets
    description: Alta, consulta y cambio de estado de tickets.
  - name: clientes
    description: Consulta de tickets por DNI del cliente.
  - name: agentes
    description: Consulta de tickets asignados a un agente (agentes precargados).
  - name: reportes
    description: Métricas calculadas a partir de los tickets.

paths:
  /tickets:                              { $ref: "partials/tickets.yaml#/paths/~1tickets" }
  /tickets/{id}:                         { $ref: "partials/tickets.yaml#/paths/~1tickets~1{id}" }
  /tickets/{id}/estado:                  { $ref: "partials/tickets.yaml#/paths/~1tickets~1{id}~1estado" }
  /clientes/{dni}/tickets:               { $ref: "partials/clientes.yaml#/paths/~1clientes~1{dni}~1tickets" }
  /agentes/{dni}/tickets:                { $ref: "partials/agentes.yaml#/paths/~1agentes~1{dni}~1tickets" }
  /reportes/frecuencia-categorias:       { $ref: "partials/reportes.yaml#/paths/~1reportes~1frecuencia-categorias" }
  /reportes/tiempo-promedio-resolucion:  { $ref: "partials/reportes.yaml#/paths/~1reportes~1tiempo-promedio-resolucion" }
  /reportes/top-categorias:              { $ref: "partials/reportes.yaml#/paths/~1reportes~1top-categorias" }
